name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        # v6.0.2; full SHA prevents a mutable tag from changing the executed code.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Bun
        # v2.2.0; full SHA prevents a mutable tag from changing the executed code.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun run audit:prod

      - name: Check formatting, linting, and types
        run: bun run check

      - name: Run tests
        run: bun run test:run

      - name: Build production application
        run: bun run build

  database:
    name: Database migration smoke test
    runs-on: ubuntu-24.04
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: carshop_ci
      DB_PASS: carshop_ci_password
      DB_NAME: carshop_ci_bootstrap
      DB_ROOT_PASS: carshop_ci_root_password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: carshop_ci_root_password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: carshop_ci_bootstrap
          MYSQL_USER: carshop_ci
          MYSQL_PASSWORD: carshop_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcarshop_ci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        # v6.0.2; full SHA prevents a mutable tag from changing the executed code.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Bun
        # v2.2.0; full SHA prevents a mutable tag from changing the executed code.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify migrations on an empty database
        run: bun run db:verify-empty
